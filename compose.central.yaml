services:
  prometheus:
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.central.yml'
    networks:
      - monitoring
      - proxy-network
    depends_on:
      - blackbox-exporter
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`${PROMETHEUS_DOMAIN}`)"

  grafana:
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    environment:
      # Admin
      - GF_SERVER_ROOT_URL=https://${GRAFANA_DOMAIN}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false

      # OIDC
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Authentik
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${OIDC_CLIENT_ID}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email entitlements
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://${OIDC_DOMAIN}/application/o/authorize/
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://${OIDC_DOMAIN}/application/o/token/
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://${OIDC_DOMAIN}/application/o/userinfo/
      - GF_AUTH_SIGNOUT_REDIRECT_URL=https://${OIDC_DOMAIN}/application/o/${OIDC_SLUG}/end-session/
    networks:
      - monitoring
      - proxy-network
    expose:
      - 3000
    depends_on:
      - prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_DOMAIN}`)"

  alertmanager:
    image: prom/alertmanager:v0.34.0
    restart: unless-stopped
    volumes:
      - ./alertmanager/:/etc/alertmanager/
    networks:
      - monitoring
      - proxy-network
    expose:
      - 9093
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertmanager.rule=Host(`${ALERTMANAGER_DOMAIN}`)"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    restart: unless-stopped
    volumes:
      - ./blackbox:/etc/blackbox_exporter
    networks:
      - monitoring
      - proxy-network
    expose:
      - 9115
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.blackbox.rule=Host(`${BLACKBOX_DOMAIN}`)"

volumes:
  grafana-data:

networks:
  proxy-network:
    external: true
